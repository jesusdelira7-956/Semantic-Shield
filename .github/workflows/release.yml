name: Build & Publish Chrome Extension Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow for icon verification
        run: pip install Pillow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read Manifest Version
        id: meta
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run Validation, Store Permission Audit, Unit Tests & Package Extension
        run: |
          python3 scripts/compile_static_rules.py --check
          python3 test_extension.py
          python3 audit_permissions.py --store
          node --test tests/shield_core.test.mjs
          python3 package_cws.py

      - name: Upload CWS Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cws-upload-package
          path: dist/semantic-shield-cws-upload.zip

      - name: Create or Update Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: "Semantic Shield v${{ steps.meta.outputs.version }} (Drag-and-Drop Chrome ZIP)"
          body: |
            ### 🛡️ Semantic Shield v${{ steps.meta.outputs.version }}
            **Sovereign Manifest V3 Chrome Extension** with Local LLM & 0.0.0.0-Day Loopback Firewall, Indirect Prompt Injection (IPI) detector, WebMCP inspector, *My Filters* live compiler, and GenAI clutter shield.

            #### ⚡ Fastest Install (Drag & Drop — No Unzipping Needed!)
            1. Download **`Semantic-Shield-v${{ steps.meta.outputs.version }}.zip`** below.
            2. Open `chrome://extensions/` in Chrome (or Brave/Edge) and turn on **Developer mode** (top right).
            3. **Drag and drop `Semantic-Shield-v${{ steps.meta.outputs.version }}.zip`** directly onto the `chrome://extensions/` page!
          files: dist/Semantic-Shield-v${{ steps.meta.outputs.version }}.zip
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cws-draft-upload:
    needs: build-and-release
    if: vars.ENABLE_CWS_UPLOAD == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Verified CWS Package
        uses: actions/download-artifact@v4
        with:
          name: cws-upload-package
          path: dist

      - name: Upload Draft Package via Chrome Web Store API
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          ACCESS_TOKEN=$(curl -fsS -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${CHROME_CLIENT_ID}" \
            -d "client_secret=${CHROME_CLIENT_SECRET}" \
            -d "refresh_token=${CHROME_REFRESH_TOKEN}" \
            -d "grant_type=refresh_token" | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            -T dist/semantic-shield-cws-upload.zip \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${CHROME_EXTENSION_ID}"
