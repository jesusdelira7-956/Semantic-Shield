name: Weekly Upstream Static Ruleset Refresh

on:
  schedule:
    - cron: '0 5 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-rulesets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install Pillow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch Upstream Trackers & Compile Static DNR Ruleset
        run: python3 scripts/compile_static_rules.py --fetch-upstream

      - name: Validate Updated Ruleset & Permissions
        run: |
          python3 scripts/compile_static_rules.py --check
          python3 test_extension.py
          python3 audit_permissions.py --store
          node --test tests/shield_core.test.mjs

      - name: Create Pull Request on Ruleset Updates
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(rules): refresh curated MV3 static tracker ruleset'
          title: 'chore(rules): automated weekly static tracker ruleset refresh'
          body: |
            Automated MV3 static tracker ruleset update generated by `scripts/compile_static_rules.py --fetch-upstream`.
            Verified with `test_extension.py`, `audit_permissions.py --store`, and `shield_core.test.mjs`.
          branch: chore/auto-refresh-static-rules
          delete-branch: true
